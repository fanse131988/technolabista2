# TechnoLAB-ISTA — serveur en ligne sur Render (https://render.com)
# ------------------------------------------------------------------
# Mode d'emploi pas à pas : voir README.md, section « Render ».
#
# 1. Pousser ce dépôt sur GitHub.
# 2. Render → New → Blueprint → choisir le dépôt : Render lit ce fichier.
# 3. Saisir ADMIN_PASSWORD quand Render le demande (8 caractères minimum).
# 4. Ouvrir https://<nom-du-service>.onrender.com/#admin (identifiant « admin »).
#
# ⚠️ DISQUE PERSISTANT = OBLIGATOIRE (plan Starter, 7 $/mois).
#    Sans disque, Render efface le système de fichiers à chaque redéploiement,
#    redémarrage ou mise en veille : comptes, contenu publié, journal et
#    sauvegardes seraient perdus. Le plan gratuit ne permet pas de disque.
services:
  - type: web
    name: technolab-ista-admin
    runtime: node
    plan: starter                 # seul plan avec disque persistant
    region: frankfurt             # le plus proche du Mali (choisir la même région pour le disque)
    rootDir: admin-server         # le serveur est dans ce sous-dossier
    buildCommand: npm install     # aucune dépendance : l'étape est instantanée
    startCommand: npm start       # → node server.js
    healthCheckPath: /api/health
    autoDeploy: true              # redéploie à chaque envoi sur GitHub
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ADMIN_PASSWORD       # mot de passe initial du compte « admin »
        sync: false               # demandé par Render, jamais écrit dans le dépôt
      - key: DATA_DIR             # doit correspondre au point de montage du disque
        value: /data
      # SITE_FILE inutile : index.html est à la racine du dépôt et le serveur le
      # trouve tout seul (…/admin-server/../index.html).
    disk:
      name: technolab-data
      mountPath: /data            # = DATA_DIR : comptes, contenu, journal, sauvegardes
      sizeGB: 1
